spring:
  data:
    mongodb:
      username: ecom
      password: pass
      host: localhost
      port: 27017
      database: notification
      authentication-database: admin

  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: paymentGroup, orderGroup
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringSerializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: orderConfirmation:com.ecommerce.kafka.OrderConfirmation, paymentConfirmation:com.ecommerce.record.PaymentNotificationRequest

  mail:
    host: localhost
    port: 1025
    username: ecom
    password: pass
    properties:
      mail:
        smtp:
          trusted: "*"
        auth: true
        starttls:
          enabled: true
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000

server:
  port: 8040
